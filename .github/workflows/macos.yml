name: macOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake pkg-config sdl2

      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci --parallel

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      - name: Prepare standalone embedding fixtures
        run: |
          mkdir -p build/ci-assets
          cp README.md 'build/ci-assets/VRally2_[RC14EU]_[multiscreen]_M5.mpn'
          cp README.md build/ci-assets/VRally2_multipack.mpc
          cp README.md build/ci-assets/VRally2_extrapack1.mpc
          cp README.md build/ci-assets/VRally2_extrapack2.mpc
          cp README.md build/ci-assets/VRally2_extrapack3.mpc
          cp README.md build/ci-assets/VRally2_extrapack4.mpc

      - name: Verify standalone macOS build
        run: >-
          cmake -S . -B build/ci-standalone
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMOPHUN_BUILD_VRALLY2_STANDALONE=ON
          -DMOPHUN_VRALLY2_ASSET_DIR="$PWD/build/ci-assets"
          -DBUILD_TESTING=OFF &&
          cmake --build build/ci-standalone --target VRally2Standalone --parallel
